name: Release

on:
  push:
    branches:
      - master

permissions: {}

# One release run at a time, so overlapping pushes cannot build the same version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A merged release PR bumps __version__, so a version without both files on PyPI is a release to finish.
  # The release is always the commit that set __version__, so a rerun or a later push publishes the
  # reviewed release PR and nothing merged after it.
  check:
    name: 🔎 Check for a new version
    runs-on: { group: github-public-amd64 }
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0

      - id: version
        run: |
          version="v$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' stream_chat/__pkg__.py)"
          test "$version" != v
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sf --retry 3 "https://pypi.org/pypi/stream-chat/${version#v}/json" |
            jq -e '[.urls[].packagetype] | index("sdist") and index("bdist_wheel")' >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            ref=$(git log -1 --format=%H -S"__version__ = \"${version#v}\"" -- stream_chat/__pkg__.py)
            tag=$(git rev-parse -q --verify "refs/tags/$version^{commit}" || true)
            if [ -n "$tag" ] && [ "$tag" != "$ref" ]; then
              echo "::error::$version is tagged at $tag, but __version__ was set in $ref"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 🏗️ Build
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: { group: github-public-amd64 }
    permissions:
      contents: read
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          ref: ${{ needs.check.outputs.ref }}

      - id: changelog
        uses: actions/github-script@211cb3fefb35a799baa5156f9321bb774fe56294 # v5.2.0
        with:
          script: |
            const get_change_log_diff = require('./scripts/get_changelog_diff.js')
            core.setOutput('changelog', get_change_log_diff())

      - uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566 # v3.1.4
        with:
          python-version: "3.10"

      - name: Build
        run: |
          pip install -q wheel==0.37.1
          python setup.py sdist bdist_wheel

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Tags the release commit before the upload. A rerun keeps the existing release.
  release:
    name: 🚀 Release
    needs: [check, build]
    runs-on: { group: github-public-amd64 }
    permissions:
      contents: write
    steps:
      - name: Create release on GitHub
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          body: ${{ needs.build.outputs.changelog }}
          tag: ${{ needs.check.outputs.version }}
          commit: ${{ needs.check.outputs.ref }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # The only job that can mint a PyPI token, so it runs no project code. The PyPI trusted
  # publisher requires the pypi environment, which only master can deploy to.
  publish:
    name: 📦 Publish to PyPI
    needs: [build, release]
    runs-on: { group: github-public-amd64 }
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # A rerun after a partial upload skips the files PyPI already has.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
