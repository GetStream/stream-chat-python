name: build
on:
  push:
    branches:
      - "master"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 🧪 Test & lint
    # Python 3.8 and 3.9 have no builds for ubuntu-26.04, which ubuntu-latest now points to.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # gives the commit message linter access to all previous commits

      - uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python }}

      - name: Install deps with ${{ matrix.python }}
        run: pip install ".[test, ci]"

      - name: Lint with ${{ matrix.python }}
        if: ${{ matrix.python == '3.8' }}
        run: make lint

      - name: Test with ${{ matrix.python }}
        env:
          STREAM_KEY: ${{ vars.STREAM_KEY }}
          STREAM_SECRET: ${{ secrets.STREAM_SECRET }}
          PYTHONPATH: ${{ github.workspace }}
        run: make test
